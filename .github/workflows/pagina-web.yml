# Publica en https://mbujosab.github.io/nacallib/ solo la página de entrada
# y la documentación en PDF. El resto del repositorio no se sirve como web.
name: Página web

on:
  push:
    branches: [master]
    paths:
      - index.html
      - nacal_src.pdf
      - .github/workflows/pagina-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reunir lo que se publica
        run: |
          mkdir _site
          cp index.html nacal_src.pdf _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
